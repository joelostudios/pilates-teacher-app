<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilates Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --bg2: #f3efe9;
  --card: #ffffff;
  --border: #e8e2d9;
  --sage: #7a9e82;
  --sage-dark: #5e8067;
  --sage-light: #c8dcc9;
  --tan: #c4a882;
  --tan-light: #f0e8dc;
  --text: #2e2a26;
  --text-muted: #7a7068;
  --warning: #d97054;
  --warning-bg: #fdf0eb;
  --error: #c0392b;
  --error-bg: #fdecea;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }

/* NAV */
#nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--sage-dark); letter-spacing: 0.5px; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); border: none; background: none; transition: all 0.15s; }
.nav-tab:hover { background: var(--bg2); color: var(--text); }
.nav-tab.active { background: var(--sage-light); color: var(--sage-dark); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.btn-logout { font-size: 12px; color: var(--text-muted); border: 1px solid var(--border); background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.btn-logout:hover { background: var(--bg2); }

/* MAIN */
#main { padding: 32px; max-width: 1100px; margin: 0 auto; }

/* LOGIN */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 380px; text-align: center; box-shadow: var(--shadow); }
.login-card h1 { font-size: 32px; color: var(--sage-dark); margin-bottom: 6px; }
.login-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
.login-card input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--bg); margin-bottom: 12px; outline: none; }
.login-card input:focus { border-color: var(--sage); }
.btn-primary { width: 100%; padding: 12px; background: var(--sage); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-primary:hover { background: var(--sage-dark); }
.error-msg { background: var(--error-bg); color: var(--error); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }

/* BUTTONS */
.btn { padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: inherit; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
.btn-sage { background: var(--sage); color: white; }
.btn-sage:hover { background: var(--sage-dark); }
.btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg2); }
.btn-danger { background: none; border: 1px solid #e0b0a8; color: var(--warning); }
.btn-danger:hover { background: var(--warning-bg); }
.btn-tan { background: var(--tan-light); color: var(--text); border: 1px solid var(--border); }
.btn-tan:hover { background: #e8dcd0; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.card-sm { padding: 16px; }

/* PAGE HEADER */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.page-header h2 { font-size: 28px; color: var(--text); }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.breadcrumb span { cursor: pointer; color: var(--sage-dark); }
.breadcrumb span:hover { text-decoration: underline; }

/* CLIENT GRID */
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.client-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
.client-card:hover { border-color: var(--sage-light); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.client-card h3 { font-size: 20px; margin-bottom: 4px; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-beginner { background: #e8f4ea; color: #3d7a47; }
.badge-intermediate { background: #fff3e0; color: #e6820a; }
.badge-advanced { background: #fce8f0; color: #c0397a; }
.badge-equipment { background: var(--bg2); color: var(--text-muted); }
.client-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* FORMS */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; background: var(--bg); outline: none; color: var(--text); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--sage); }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
.toggle-label { font-size: 14px; color: var(--text); }
.toggle { position: relative; width: 44px; height: 24px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; transition: 0.2s; cursor: pointer; }
.toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--sage); }
.toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* INJURY WARNING */
.injury-banner { background: var(--warning-bg); border: 1px solid #f0c8b8; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; }
.injury-banner .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.injury-banner strong { font-size: 12px; font-weight: 600; color: var(--warning); display: block; margin-bottom: 2px; }
.injury-banner p { font-size: 13px; color: var(--text); }

/* PROFILE TABS */
.profile-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.profile-tab { padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: inherit; }
.profile-tab.active { color: var(--sage-dark); border-bottom-color: var(--sage); }

/* CLASS LIST */
.class-list { display: flex; flex-direction: column; gap: 12px; }
.class-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.class-card-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg2); }
.class-card-header h3 { font-size: 18px; }
.class-card-body { padding: 16px 20px; }
.movement-list { display: flex; flex-direction: column; gap: 6px; }
.movement-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; position: relative; }
.movement-item.has-warning { border-color: #f0c8b8; background: var(--warning-bg); }
.movement-item .drag-handle { cursor: grab; color: var(--text-muted); font-size: 16px; flex-shrink: 0; line-height: 1; }
.movement-item .drag-handle:active { cursor: grabbing; }
.movement-name { font-weight: 500; flex: 1; font-size: 13px; }
.movement-meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.warning-tag { font-size: 11px; background: var(--warning-bg); color: var(--warning); border: 1px solid #f0c8b8; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
.movement-actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 14px; color: var(--text-muted); transition: all 0.15s; }
.icon-btn:hover { background: var(--bg2); color: var(--text); }
.icon-btn.delete:hover { background: var(--warning-bg); color: var(--warning); }
.dragging { opacity: 0.4; }
.drag-over { border-top: 2px solid var(--sage); }

/* LIBRARY */
.library-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.library-filters input { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-family: inherit; background: var(--card); outline: none; }
.library-filters input:focus { border-color: var(--sage); }
.library-filters select { padding: 9px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-family: inherit; background: var(--card); outline: none; color: var(--text); cursor: pointer; }
.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lib-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.lib-card h4 { font-size: 15px; font-family: 'Cormorant Garamond', serif; font-weight: 500; margin-bottom: 4px; }
.lib-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
.lib-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.lib-card-tags .badge { font-size: 10px; padding: 2px 8px; }
.lib-card.selectable { cursor: pointer; transition: all 0.15s; }
.lib-card.selectable:hover { border-color: var(--sage); background: #f6fbf6; }
.lib-count { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }

/* SWAP PANEL */
.swap-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.swap-panel-inner { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 700px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.swap-panel-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.swap-panel-header h3 { font-size: 20px; }
.swap-panel-body { overflow-y: auto; padding: 20px 24px; flex: 1; }
.swap-mode-picker { display: flex; gap: 10px; margin-bottom: 20px; }
.swap-mode-btn { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); text-align: center; cursor: pointer; transition: all 0.15s; }
.swap-mode-btn:hover, .swap-mode-btn.active { border-color: var(--sage); background: #f6fbf6; }
.swap-mode-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }
.swap-mode-btn .label { font-size: 13px; font-weight: 500; color: var(--text); }
.swap-mode-btn .desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.suggestion-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; }
.suggestion-card:hover { border-color: var(--sage); background: #f6fbf6; }
.suggestion-card h4 { font-size: 15px; font-family: 'Cormorant Garamond', serif; font-weight: 500; margin-bottom: 3px; }
.suggestion-card p { font-size: 12px; color: var(--text-muted); }

/* ADD MOVEMENT PANEL */
.add-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 16px; }
.add-panel h4 { font-size: 18px; margin-bottom: 16px; }

/* HISTORY */
.history-item { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.history-item-header { padding: 14px 18px; background: var(--bg2); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.history-item-header:hover { background: var(--bg); }
.history-item-body { padding: 16px 18px; border-top: 1px solid var(--border); }
.history-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 16px; }
.history-meta span { display: flex; align-items: center; gap: 4px; }

/* SECTION DIVIDER */
.section-divider { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px 4px; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state h3 { font-size: 22px; margin-bottom: 6px; color: var(--text); }
.empty-state p { font-size: 13px; margin-bottom: 20px; }

/* NOTIFICATION */
#notification { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
#notification.show { opacity: 1; }

/* RESPONSIVE */
@media (max-width: 768px) {
  #main { padding: 16px; }
  #nav { padding: 0 16px; }
  .form-row { grid-template-columns: 1fr; }
  .library-grid { grid-template-columns: 1fr; }
  .client-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login-screen" style="display:none">

<div id="notification"></div>

function isAuthed(){ return sessionStorage.getItem('sg_auth')==='1'; }
function doLogin(){
  const v = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if(v===_pw){
    sessionStorage.setItem('sg_auth','1');
    boot();
  } else {
    err.textContent='Incorrect password. Please try again.';
    err.style.display='block';
    document.getElementById('login-password').value='';
  }

  sessionStorage.removeItem('sg_auth');
  document.getElementById('app-shell').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-password').value='';
}

  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderApp();
}

function injuries(client){
  if(!client||!client.injuries) return [];
  return client.injuries.toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
}
function movHasWarning(mov,client){
  const injs=injuries(client);
  if(!injs.length) return false;
  const cStr=mov.contra.join(' ').toLowerCase();
  return injs.some(inj=>cStr.includes(inj)||inj.split(' ').some(w=>w.length>3&&cStr.includes(w)));
}
function formatDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// CLASS GENERATION
// ============================================================
const SESSION_MOVEMENTS = {40:13,50:17,60:22};
const SECTION_ORDER = ['warm-up','footwork','abdominal series','side body','back extension','cool-down'];
const SECTION_DISTRIBUTION = {
  13: {'warm-up':2,'footwork':2,'abdominal series':3,'side body':2,'back extension':2,'cool-down':2},
  17: {'warm-up':3,'footwork':3,'abdominal series':4,'side body':3,'back extension':3,'cool-down':1},
  22: {'warm-up':3,'footwork':3,'abdominal series':5,'side body':3,'back extension':4,'cool-down':4}
};

function diffPool(difficulty){
  if(difficulty==='beginner') return ['beginner'];
  if(difficulty==='intermediate') return ['beginner','intermediate'];
  return ['beginner','intermediate','advanced'];
}

function generateClass(client, usedIds=[]){
  const total = SESSION_MOVEMENTS[client.sessionLength]||13;
  // find closest key
  const key = [13,17,22].reduce((a,b)=>Math.abs(b-total)<Math.abs(a-total)?b:a);
  const dist = SECTION_DISTRIBUTION[key];
  const pool = diffPool(client.experience);
  const result = [];

  SECTION_ORDER.forEach(section=>{
    const count = dist[section]||0;
    let candidates = MOVEMENTS.filter(m=>
      m.section===section &&
      pool.includes(m.difficulty) &&
      !result.some(r=>r.id===m.id) &&
      !usedIds.includes(m.id)
    );
    if(!candidates.length){
      candidates = MOVEMENTS.filter(m=>m.section===section && pool.includes(m.difficulty) && !result.some(r=>r.id===m.id));
    }
    if(!candidates.length) candidates = MOVEMENTS.filter(m=>m.section===section);
    const chosen = shuffle(candidates).slice(0,count);
    result.push(...chosen);
  });
  return result;
}

function generateWeek(client){
  const num = client.classesPerWeek||2;
  const classes = [];
  if(client.repeatClasses){
    const base = generateClass(client);
    for(let i=0;i<num;i++) classes.push({movements:[...base]});
  } else {
    const allUsed = [];
    for(let i=0;i<num;i++){
      const movs = generateClass(client, allUsed);
      movs.forEach(m=>allUsed.push(m.id));
      classes.push({movements:movs});
    }
  }
  return classes;
}

// ============================================================
// SWAP SUGGESTIONS
// ============================================================
function getAISuggestions(mov, currentClass, client){
  const pool = diffPool(client ? client.experience : 'advanced');
  const inClass = currentClass.map(m=>m.id);
  let candidates = MOVEMENTS.filter(m=>
    m.id !== mov.id &&
    !inClass.includes(m.id) &&
    m.section === mov.section &&
    m.bodyRegion === mov.bodyRegion &&
    pool.includes(m.difficulty)
  );
  if(candidates.length < 3){
    const more = MOVEMENTS.filter(m=>
      m.id !== mov.id &&
      !inClass.includes(m.id) &&
      m.section === mov.section &&
      pool.includes(m.difficulty) &&
      !candidates.some(c=>c.id===m.id)
    );
    candidates = [...candidates, ...more];
  }
  return shuffle(candidates).slice(0,3);
}

function saveClient(){

  const err = document.getElementById('form-error');

  err.style.display='none';
  const data = {
    name,
    age: document.getElementById('f-age').value||null,
    experience: document.getElementById('f-exp').value,
    classesPerWeek: parseInt(document.getElementById('f-cpw').value),
    sessionLength: parseInt(document.getElementById('f-len').value),
    goals: document.getElementById('f-goals').value.trim(),
    injuries: document.getElementById('f-injuries').value.trim(),
    repeatClasses: document.getElementById('f-repeat').checked,
  };
  if(EDITING_CLIENT){
    const idx = clients.findIndex(c=>c.id===EDITING_CLIENT);
    clients[idx]={...clients[idx],...data};
    persist();
    SELECTED_CLIENT_ID=EDITING_CLIENT;
    CLIENT_VIEW='profile';
    GENERATED_CLASSES=[];
    renderApp();
    showNotif('Client updated');
  } else {
    if(clients.length>=10){ alert('10 client limit reached'); return; }
    const c={id:newId(),...data};
    clients.push(c);
    persist();
    SELECTED_CLIENT_ID=c.id;
    CLIENT_VIEW='profile';
    GENERATED_CLASSES=[];
    renderApp();
    showNotif('Client added');
  }
}

function deleteClient(id){
  if(!confirm('Delete this client and all their saved classes?')) return;
  clients=clients.filter(c=>c.id!==id);
  delete savedClasses[id];
  persist();
  CLIENT_VIEW='list';
  renderApp();
  showNotif('Client deleted');
}

function renderSectionedMovements(movements, classIdx, client, editable){
  let html='';
  let lastSection='';
  movements.forEach((mov,movIdx)=>{
    if(mov.section!==lastSection){
      html+=`<div class="section-divider">${mov.section}</div>`;
      lastSection=mov.section;
    }
    const warn = movHasWarning(mov,client);
    html+=`
      <div class="movement-item ${warn?'has-warning':''} ${editable?'draggable-item':''}"
        id="mov-${classIdx}-${movIdx}"
        ${editable?`draggable="true"
          ondragstart="dragStart(event,${classIdx},${movIdx})"
          ondragover="dragOver(event,${classIdx},${movIdx})"
          ondrop="dragDrop(event,${classIdx},${movIdx})"
          ondragleave="dragLeave(event)"`:''}>
        ${editable?`<span class="drag-handle">⠿</span>`:''}
        <div style="flex:1;min-width:0">
          <div class="movement-name">${mov.name}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${mov.desc.substring(0,70)}${mov.desc.length>70?'…':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${warn?`<span class="warning-tag">⚠ check injury</span>`:''}
          <span class="movement-meta">${mov.equipment}</span>
          ${diffBadge(mov.difficulty)}
          ${editable?`
            <button class="icon-btn" title="Swap" onclick="openSwap(${classIdx},${movIdx})">⇄</button>
            <button class="icon-btn delete" title="Remove" onclick="removeMovement(${classIdx},${movIdx})">✕</button>
          `:''}
        </div>
      </div>
    `;
  });
  return html;
}

  renderApp();
}
function doneEditing(){
  EDITING_CLASS_IDX=null;
  SHOW_ADD_PANEL=false;

}

function doGenerate(){
  const c=getClient(SELECTED_CLIENT_ID);
  GENERATED_CLASSES=generateWeek(c).map(cls=>({movements:cls.movements}));
  EDITING_CLASS_IDX=null;
  SHOW_ADD_PANEL=false;

function saveAllClasses(){
  const c=getClient(SELECTED_CLIENT_ID);
  if(!savedClasses[c.id]) savedClasses[c.id]=[];
  const num = (savedClasses[c.id].length);
  GENERATED_CLASSES.forEach((cls,i)=>{
    savedClasses[c.id].unshift({
      id:newId(),
      date:Date.now(),
      classNum:num+i+1,
      length:c.sessionLength,
      movements:cls.movements.map(m=>({id:m.id,name:m.name,section:m.section,equipment:m.equipment,difficulty:m.difficulty}))
    });
  });
  persist();
  showNotif('Classes saved to history');
}

function saveOneClass(idx){
  const c=getClient(SELECTED_CLIENT_ID);
  if(!savedClasses[c.id]) savedClasses[c.id]=[];
  const cls=GENERATED_CLASSES[idx];
  savedClasses[c.id].unshift({
    id:newId(),
    date:Date.now(),
    classNum:(savedClasses[c.id].length)+1,

  showNotif(`Class ${idx+1} saved`);

// ============================================================
// DRAG AND DROP
// ============================================================
function dragStart(e,classIdx,movIdx){
  DRAG_IDX=movIdx;
  e.dataTransfer.effectAllowed='move';
  e.target.classList.add('dragging');
}
function dragOver(e,classIdx,movIdx){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function dragDrop(e,classIdx,movIdx){
  e.preventDefault();
  if(DRAG_IDX===null||DRAG_IDX===movIdx) return;
  const movs=GENERATED_CLASSES[classIdx].movements;
  const [item]=movs.splice(DRAG_IDX,1);
  movs.splice(movIdx,0,item);
  DRAG_IDX=null;
  renderApp();
}

// ============================================================
// SWAP
// ============================================================
function openSwap(classIdx, movIdx){
  SWAP_STATE={classIdx,movIdx,mode:null};
  renderSwapPanel();
}
function closeSwap(){
  SWAP_STATE=null;
  document.getElementById('swap-panel').style.display='none';
}

function renderSwapPanel(){
  const panel=document.getElementById('swap-panel');
  if(!SWAP_STATE){panel.style.display='none';return;}
  const {classIdx,movIdx,mode}=SWAP_STATE;
  const cls=GENERATED_CLASSES[classIdx];
  const mov=cls.movements[movIdx];
  const client=getClient(SELECTED_CLIENT_ID);
  let body='';
  if(!mode){
    body=`
      <div class="swap-mode-picker">
        <div class="swap-mode-btn" onclick="setSwapMode('ai')">
          <span class="icon">✨</span>
          <div class="label">AI Suggestions</div>
          <div class="desc">3 alternatives matched by region &amp; order</div>
        </div>
        <div class="swap-mode-btn" onclick="setSwapMode('library')">
          <span class="icon">📚</span>
          <div class="label">Browse Library</div>
          <div class="desc">Pick any movement from the full library</div>
        </div>
      </div>
    `;
  } else if(mode==='ai'){
    const suggestions=getAISuggestions(mov,cls.movements,client);
    body=`
      <button class="btn btn-outline btn-sm" style="margin-bottom:16px" onclick="setSwapMode(null)">← Back</button>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px">Alternatives matching <strong>${mov.section}</strong> · <strong>${mov.bodyRegion}</strong></p>
      ${suggestions.length?suggestions.map(s=>`
        <div class="suggestion-card" onclick="confirmSwap('${s.id}')">
          <h4>${s.name}</h4>
          <p>${s.desc.substring(0,80)}…</p>
          <div style="margin-top:8px;display:flex;gap:6px">${eqBadge(s.equipment)}${diffBadge(s.difficulty)}</div>
        </div>
      `).join(''):`<p style="color:var(--text-muted);font-size:13px">No close matches found. Try browsing the library.</p>`}
    `;
  } else if(mode==='library'){
    const f=SWAP_LIB_FILTERS;
    const filtered=applyFilters(MOVEMENTS,f).filter(m=>m.id!==mov.id);
    body=`
      <button class="btn btn-outline btn-sm" style="margin-bottom:14px" onclick="setSwapMode(null)">← Back</button>
      ${renderFilterBar(f,'swapLibFilter')}
      <div style="margin-top:12px">
        ${filtered.slice(0,40).map(s=>`
          <div class="suggestion-card" onclick="confirmSwap('${s.id}')">
            <h4>${s.name}</h4>
            <p>${s.equipment} · ${s.difficulty} · ${s.section}</p>
          </div>
        `).join('')}
      </div>
    `;
  }
  panel.style.display='flex';
  panel.innerHTML=`
    <div class="swap-panel-inner">
      <div class="swap-panel-header">
        <div>
          <h3>Swap: ${mov.name}</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:2px">${mov.section} · ${mov.bodyRegion}</p>
        </div>
        <button class="icon-btn" onclick="closeSwap()" style="font-size:20px">✕</button>
      </div>
      <div class="swap-panel-body">${body}</div>
    </div>
  `;
}

function setSwapMode(mode){
  SWAP_STATE.mode=mode;
  SWAP_LIB_FILTERS={equipment:'all',difficulty:'all',bodyRegion:'all',search:''};
  renderSwapPanel();
}

function confirmSwap(movId){
  const newMov=MOVEMENTS.find(m=>m.id===movId);
  if(!newMov) return;
  const {classIdx,movIdx}=SWAP_STATE;
  GENERATED_CLASSES[classIdx].movements[movIdx]=newMov;
  closeSwap();
  renderApp();
  showNotif(`Swapped to ${newMov.name}`);
}

    <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">${history.length} saved session${history.length>1?'s':''}</div>
    ${history.map(h=>`
      <div class="history-item">
        <div class="history-item-header" onclick="toggleHistory('${h.id}')">
          <div>
            <div style="font-weight:500;font-size:14px">Class ${h.classNum} — ${formatDate(h.date)}</div>
            <div class="history-meta" style="margin-top:4px">
              <span>🕐 ${h.length} min</span>
              <span>🏃 ${h.movements.length} movements</span>
            </div>
          </div>
          <span style="color:var(--text-muted);font-size:18px">${HISTORY_OPEN[h.id]?'∧':'∨'}</span>
        </div>
        ${HISTORY_OPEN[h.id]?`
          <div class="history-item-body">
            ${h.movements.map(m=>`
              <div class="movement-item" style="margin-bottom:6px">
                <div style="flex:1"><div class="movement-name">${m.name}</div></div>
                <span class="movement-meta">${m.equipment||''}</span>
                ${m.difficulty?diffBadge(m.difficulty):''}
              </div>
            `).join('')}
          </div>
        `:''}
      </div>
    `).join('')}
  `;
}

function toggleHistory(id){
  HISTORY_OPEN[id]=!HISTORY_OPEN[id];
  renderApp();
}

// ============================================================
// LIBRARY VIEW
// ============================================================
function renderLibraryView(){
  const f=LIB_FILTERS;
  const filtered=applyFilters(MOVEMENTS,f);
  return `
    <div class="page-header"><h2>Movement Library</h2><span style="font-size:13px;color:var(--text-muted)">${MOVEMENTS.length} movements total</span></div>
    ${renderFilterBar(f,'libFilter')}
    <div class="lib-count">${filtered.length} movement${filtered.length!==1?'s':''} shown</div>
    <div class="library-grid">
      ${filtered.map(m=>`
        <div class="lib-card">
          <h4>${m.name}</h4>
          <p>${m.desc}</p>
          <div class="lib-card-tags">
            ${eqBadge(m.equipment)}
            ${diffBadge(m.difficulty)}
            ${regionBadge(m.bodyRegion)}
            ${m.contra.length?`<span class="badge" style="background:var(--warning-bg);color:var(--warning);font-size:10px;padding:2px 8px">contraindications</span>`:''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function applyFilters(movements, f){
  return movements.filter(m=>{
    if(f.equipment&&f.equipment!=='all'&&m.equipment!==f.equipment) return false;
    if(f.difficulty&&f.difficulty!=='all'&&m.difficulty!==f.difficulty) return false;
    if(f.bodyRegion&&f.bodyRegion!=='all'&&m.bodyRegion!==f.bodyRegion) return false;
    if(f.search&&!m.name.toLowerCase().includes(f.search.toLowerCase())&&!m.desc.toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  });
}

const EQUIPMENTS=[...new Set(MOVEMENTS.map(m=>m.equipment))].sort();
const REGIONS=[...new Set(MOVEMENTS.map(m=>m.bodyRegion))].sort();

function renderFilterBar(f, fnPrefix){
  return `
    <div class="library-filters">
      <input type="text" placeholder="Search movements…" value="${f.search||''}" oninput="${fnPrefix}Search(this.value)">
      <select onchange="${fnPrefix}Eq(this.value)">
        <option value="all" ${f.equipment==='all'?'selected':''}>All equipment</option>
        ${EQUIPMENTS.map(e=>`<option value="${e}" ${f.equipment===e?'selected':''}>${e}</option>`).join('')}
      </select>
      <select onchange="${fnPrefix}Diff(this.value)">
        <option value="all" ${f.difficulty==='all'?'selected':''}>All levels</option>
        <option value="beginner" ${f.difficulty==='beginner'?'selected':''}>Beginner</option>
        <option value="intermediate" ${f.difficulty==='intermediate'?'selected':''}>Intermediate</option>
        <option value="advanced" ${f.difficulty==='advanced'?'selected':''}>Advanced</option>
      </select>
      <select onchange="${fnPrefix}Region(this.value)">
        <option value="all" ${f.bodyRegion==='all'?'selected':''}>All regions</option>
        ${REGIONS.map(r=>`<option value="${r}" ${f.bodyRegion===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
  `;
}

// Filter handlers — library
function libFilterSearch(v){LIB_FILTERS.search=v;renderApp();}
function libFilterEq(v){LIB_FILTERS.equipment=v;renderApp();}
function libFilterDiff(v){LIB_FILTERS.difficulty=v;renderApp();}
function libFilterRegion(v){LIB_FILTERS.bodyRegion=v;renderApp();}

// Filter handlers — swap/add panel
function swapLibFilterSearch(v){SWAP_LIB_FILTERS.search=v;renderSwapPanel&&renderSwapPanel();renderApp();}
function swapLibFilterEq(v){SWAP_LIB_FILTERS.equipment=v;renderSwapPanel&&renderSwapPanel();renderApp();}
function swapLibFilterDiff(v){SWAP_LIB_FILTERS.difficulty=v;renderSwapPanel&&renderSwapPanel();renderApp();}
function swapLibFilterRegion(v){SWAP_LIB_FILTERS.bodyRegion=v;renderSwapPanel&&renderSwapPanel();renderApp();}

// ============================================================
// INIT
// ============================================================
loadData();
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(isAuthed()) boot();
else document.getElementById('login-screen').style.display='flex';
</script>
