<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilates Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --bg2: #f3efe9;
  --card: #ffffff;
  --border: #e8e2d9;
  --sage: #7a9e82;
  --sage-dark: #5e8067;
  --sage-light: #c8dcc9;
  --sidebar: #3f5c47;
  --sidebar-text: #f7f4ee;
  --sidebar-muted: #c9d9c6;
  --tan: #c4a882;
  --tan-light: #f0e8dc;
  --text: #2e2a26;
  --text-muted: #7a7068;
  --text-faint: #a89f93;
  --warning: #d97054;
  --warning-bg: #fdf0eb;
  --error: #c0392b;
  --error-bg: #fdecea;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }
@keyframes riseIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
@keyframes slideInRight { from{transform:translateX(100%)} to{transform:translateX(0)} }

/* LOGIN */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 380px; text-align: center; box-shadow: var(--shadow); }
.login-card h1 { font-size: 32px; color: var(--sage-dark); margin-bottom: 6px; }
.login-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
.login-card input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--bg); margin-bottom: 12px; outline: none; }
.login-card input:focus { border-color: var(--sage); }
.btn-primary { width: 100%; padding: 12px; background: var(--sage); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-primary:hover { background: var(--sage-dark); }
.error-msg { background: var(--error-bg); color: var(--error); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; text-align:left; }

/* SHELL / SIDEBAR */
#app-shell { display:none; }
#app-shell.on { display:flex; min-height:100vh; }
#sidebar { width:230px; flex-shrink:0; background:var(--sidebar); display:flex; flex-direction:column; padding:26px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.sidebar-logo { display:flex; align-items:center; gap:10px; padding:0 8px; margin-bottom:28px; color:var(--sidebar-text); }
.sidebar-logo span { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px; letter-spacing:0.3px; }
.sidebar-section-label { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#a8c2a3; padding:0 10px; margin-bottom:8px; }
.sidebar-nav { display:flex; flex-direction:column; gap:2px; }
.sidebar-link { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; color:var(--sidebar-muted); font-size:13.5px; font-weight:500; text-decoration:none; border:none; background:none; cursor:pointer; font-family:inherit; text-align:left; width:100%; }
.sidebar-link:hover { background:rgba(255,255,255,0.08); color:var(--sidebar-text); }
.sidebar-link.active { background:rgba(255,255,255,0.14); color:var(--sidebar-text); font-weight:600; }
.sidebar-spacer { flex:1; }
.btn-logout { display:flex; align-items:center; justify-content:center; gap:6px; font-size: 12px; color: var(--sidebar-muted); border: 1px solid rgba(255,255,255,0.16); background: none; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-family:inherit; width:100%; }
.btn-logout:hover { background: rgba(255,255,255,0.08); color:var(--sidebar-text); }
#main-content { flex:1; min-width:0; padding:40px 48px 100px; }
.page-wrap { max-width:1180px; margin:0 auto; }

/* BUTTONS */
.btn { padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: inherit; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
.btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
.btn-sage { background: var(--sage); color: white; }
.btn-sage:hover { background: var(--sage-dark); }
.btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg2); }
.btn-danger { background: none; border: 1px solid #e0b0a8; color: var(--warning); }
.btn-danger:hover { background: var(--warning-bg); }
.btn:disabled { opacity:0.55; cursor:not-allowed; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 14px; color: var(--text-muted); transition: all 0.15s; }
.icon-btn:hover { background: var(--bg2); color: var(--text); }
.icon-btn.delete:hover { background: var(--warning-bg); color: var(--warning); }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.card-sm { padding: 16px; }
.card-flat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
.eyebrow { font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:#8a9a86; margin-bottom:9px; }

/* PAGE HEADER */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap:wrap; gap:12px; }
.page-header h2 { font-size: 30px; color: var(--text); }
.page-sub { color:var(--text-muted); font-size:13.5px; margin:6px 0 24px; max-width:600px; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.breadcrumb span { cursor: pointer; color: var(--sage-dark); }
.breadcrumb span:hover { text-decoration: underline; }

/* CLIENT GRID */
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.client-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
.client-card:hover { border-color: var(--sage-light); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.avatar-circle { width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; color:#fff; }
.avatar-circle.lg { width:52px; height:52px; font-size:18px; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space:nowrap; }
.badge-beginner { background: #e8f4ea; color: #3d7a47; }
.badge-intermediate { background: #fdf0dc; color: #b8720a; }
.badge-advanced { background: #fbe4ee; color: #b13d78; }
.badge-equipment { background: var(--bg2); color: var(--text-muted); font-weight:500; }
.badge-neutral { background:#f3efe9; color:var(--text-muted); font-weight:500; }
.client-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* FORMS */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; background: var(--bg); outline: none; color: var(--text); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--sage); }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
.toggle-label { font-size: 14px; color: var(--text); }
.toggle { position: relative; width: 44px; height: 24px; flex-shrink:0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; transition: 0.2s; cursor: pointer; }
.toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--sage); }
.toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* MODALS + PANELS */
.modal-overlay { position:fixed; inset:0; background:rgba(30,26,20,0.45); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box { background:#fff; border-radius:20px; width:100%; max-width:520px; padding:32px; max-height:88vh; overflow-y:auto; animation:riseIn 0.2s ease; }
.modal-box.narrow { max-width:440px; }
.modal-box.wide { max-width:640px; }
.modal-title { font-size:22px; font-weight:600; font-family:'Cormorant Garamond',serif; margin-bottom:20px; }
.slideover-overlay { position:fixed; inset:0; background:rgba(30,26,20,0.4); z-index:310; display:flex; justify-content:flex-end; }
.slideover-panel { width:100%; max-width:420px; height:100%; background:#fff; overflow-y:auto; padding:28px; animation:slideInRight 0.22s ease; }

/* PROFILE TABS */
.profile-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; flex-wrap:wrap; }
.profile-tab { padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: inherit; white-space:nowrap; }
.profile-tab.active { color: var(--sage-dark); border-bottom-color: var(--sage); font-weight:600; }

/* INJURY / WARNING BANNERS */
.injury-banner { background: var(--warning-bg); border: 1px solid #f0c8b8; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start; }
.injury-banner .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.injury-banner strong { font-size: 12px; font-weight: 600; color: var(--warning); display: block; margin-bottom: 2px; }
.injury-banner p { font-size: 13px; color: var(--text); }
.plan-banner { display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--tan-light); border:1px solid #ddc9a8; border-radius:12px; padding:14px 18px; margin-bottom:20px; flex-wrap:wrap; }

/* CONDITIONS / SYMPTOMS */
.list-row { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--bg); border-radius:10px; flex-wrap:wrap; gap:8px; margin-bottom:8px; cursor:pointer; }
.list-row:hover { background:var(--bg2); }
.chip { font-size:10.5px; padding:3px 10px; border-radius:20px; background:var(--bg2); color:var(--text-muted); font-weight:500; white-space:nowrap; }
.chip-source { font-size:10px; padding:3px 9px; border-radius:20px; background:#eaf1e9; color:#3d7a47; font-weight:600; white-space:nowrap; cursor:pointer; }
.pick-row { padding:11px 14px; border-radius:9px; cursor:pointer; font-size:13px; background:var(--bg); margin-bottom:6px; }
.pick-row:hover { background:var(--bg2); }
.empty-state { text-align: center; padding: 44px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 30px; margin-bottom: 10px; }
.empty-state h3 { margin-bottom: 6px; color:var(--text); }
.empty-state p { font-size: 13px; margin-bottom: 16px; }
.empty-state-sm { text-align:center; padding:26px 10px; }
.empty-state-sm div:first-child { font-size:13px; color:var(--text-muted); margin-bottom:4px; }
.empty-state-sm div:last-child { font-size:11.5px; color:var(--text-faint); }

/* ASSESSMENT */
.progress-track { height:6px; background:var(--tan-light); border-radius:20px; overflow:hidden; margin:10px 0 22px; }
.progress-fill { height:100%; background:var(--sage); border-radius:20px; transition:width 0.3s ease; }
.collapse-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; }
.collapse-header { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; cursor:pointer; flex-wrap:wrap; gap:10px; }
.collapse-body { padding:0 20px 20px; border-top:1px solid #f0ece4; }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; }
.field-label { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; }

/* 3-MONTH PLAN */
.plan-week-row { display:flex; align-items:center; gap:16px; padding:13px 18px; border-radius:10px; cursor:pointer; background:#fff; border:1px solid var(--border); margin-bottom:8px; flex-wrap:wrap; }
.plan-week-row.current { background:#eef4ec; border-color:var(--sage); }
.plan-week-row.done { opacity:0.55; }
.plan-week-row.upcoming { opacity:0.85; }
.plan-week-num { width:34px; flex-shrink:0; font-size:12px; color:var(--text-muted); font-weight:600; }
.plan-week-edit { padding:16px 18px; border-radius:10px; background:#fff; border:1px solid var(--sage); display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }

/* GOAL TAGS */
.goal-chip { font-size:10.5px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap; }
.goal-toggle { padding:7px 14px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--text-muted); }
.goal-toggle.active.strengthen { background:#7a9e82; color:#fff; border-color:#7a9e82; }
.goal-toggle.active.stretch { background:#f0e8dc; color:#8a7554; border-color:#ddc9a8; }
.goal-toggle.active.stamina { background:#fdf0eb; color:#d97054; border-color:#f0c8b8; }
.goal-toggle.active.stability { background:#c8dcc9; color:#3f5c47; border-color:#c8dcc9; }

/* SESSION BUILDER */
.format-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:760px; }
.format-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:30px 26px; cursor:pointer; text-align:left; }
.format-card:hover { border-color:var(--sage-light); box-shadow:0 4px 20px rgba(0,0,0,0.06); }
.format-card h3 { font-size:20px; margin-bottom:8px; }
.format-card p { font-size:13px; color:var(--text-muted); line-height:1.5; }
.sb-header-bar { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; justify-content:space-between; background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:22px; }
.stepper { display:flex; align-items:center; gap:8px; margin-bottom:24px; max-width:420px; }
.step-circle { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; background:var(--border); color:var(--text-muted); flex-shrink:0; }
.step-circle.done { background:var(--sage); color:#fff; }
.step-circle.active { background:var(--sage-dark); color:#fff; }
.step-line { flex:1; height:2px; background:var(--border); }
.step-line.done { background:var(--sage); }
.level-pill { padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border); background:#fff; cursor:pointer; }
.level-pill.active { background:var(--sage); color:#fff; border-color:var(--sage); }
.chip-removable { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px; background:var(--bg2); font-size:12px; }
.chip-removable button { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0; font-size:12px; }
.stage-block { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:16px; }
.exercise-row { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--bg); border-radius:8px; margin-bottom:6px; gap:8px; flex-wrap:wrap; }
.exercise-row.has-warning { background:var(--warning-bg); border:1px solid #f0c8b8; }
.inline-picker { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:12px; }
.picker-tabs { display:flex; gap:4px; margin-bottom:10px; }
.picker-tab { padding:6px 12px; font-size:12px; font-weight:600; border:none; background:none; color:var(--text-muted); border-radius:8px; cursor:pointer; }
.picker-tab.active { background:var(--sage-light); color:var(--sage-dark); }
.summary-block { background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:14px; }

/* CLASS BUILDER */
.theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.theme-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; }
.theme-card:hover { border-color:var(--sage-light); }
.theme-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }

/* REFERENCE LIBRARY */
.doc-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 18px; cursor:pointer; margin-bottom:10px; }
.doc-card:hover { border-color:var(--sage-light); }
.doc-section { margin-bottom:20px; }
.doc-section.highlighted { background:#eef4ec; border-radius:10px; padding:14px 16px; margin-left:-16px; margin-right:-16px; }

/* SWAP / DRAG */
.movement-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; position: relative; }
.movement-item.has-warning { border-color: #f0c8b8; background: var(--warning-bg); }
.movement-item .drag-handle { cursor: grab; color: var(--text-muted); font-size: 16px; flex-shrink: 0; line-height: 1; }
.movement-name { font-weight: 500; flex: 1; font-size: 13px; }
.movement-meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.warning-tag { font-size: 11px; background: var(--warning-bg); color: var(--warning); border: 1px solid #f0c8b8; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
.section-divider { font-size:10.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-faint); margin:12px 0 6px; }
.dragging { opacity: 0.4; }
.drag-over { border-top: 2px solid var(--sage); }

/* LIBRARY FILTERS (reused in pickers) */
.library-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.library-filters input { flex: 1; min-width: 180px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-family: inherit; background: var(--card); outline: none; }
.library-filters select { padding: 9px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-family: inherit; background: var(--card); outline: none; color: var(--text); cursor: pointer; }

#notification { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: white; padding: 13px 22px; border-radius: 11px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 999; }
#notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  #sidebar { width:80px; padding:20px 10px; }
  .sidebar-logo span, .sidebar-link span.label, .sidebar-section-label, .btn-logout span.label { display:none; }
  .sidebar-link { justify-content:center; }
  #main-content { padding:24px 18px 80px; }
}
@media (max-width: 768px) {
  .form-row, .field-grid, .format-grid { grid-template-columns: 1fr; }
  .client-grid, .theme-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Pilates Studio</h1>
    <p class="subtitle">Sign in to access your studio</p>
    <div id="login-error" class="error-msg" style="display:none"></div>
    <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div id="app-shell">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d7e8d4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13c0-6 4-10 10-10 1 8-3 14-10 14-3 0-4-2-4-4z"/><path d="M6 18C10 14 14 10 18 6"/></svg>
      <span>Pilates Studio</span>
    </div>
    <div class="sidebar-section-label">Studio</div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="sidebar-link" data-view="clients" onclick="navTo('clients')"><span>👥</span><span class="label">Clients</span></button>
      <button class="sidebar-link" data-view="sessionBuilder" onclick="navTo('sessionBuilder')"><span>🗓️</span><span class="label">Session Builder</span></button>
      <button class="sidebar-link" data-view="classBuilder" onclick="navTo('classBuilder')"><span>🧩</span><span class="label">Class Builder</span></button>
      <button class="sidebar-link" data-view="referenceLibrary" onclick="navTo('referenceLibrary')"><span>📚</span><span class="label">Reference Library</span></button>
    </nav>

function migrateClient(old){
  return {
    id: old.id, name: old.name, age: old.age, experience: old.experience||'beginner',
    sessionLength: old.sessionLength||50, classesPerWeek: old.classesPerWeek||2,
    goals: old.goals||'', repeatClasses: !!old.repeatClasses,
    conditions: [], symptoms: [], assessment: newDefaultAssessment(),
    planStartDate: null, planWeeksOverride: {}, planHistory: [], recentSessions: [],
    legacyInjuryNotes: old.injuries||'',
  };
}

function daysAgo(n){ return new Date(Date.now()-n*864e5).toISOString().slice(0,10); }

function migrateLegacySessions(rawClasses, migratedClients){
  const out = {};
  Object.keys(rawClasses||{}).forEach(clientId=>{
    const c = migratedClients.find(x=>x.id===clientId);
    if(!c) return;
    (rawClasses[clientId]||[]).forEach(old=>{
      const apparatusCounts = {};
      (old.movements||[]).forEach(m=>{ const a = m.apparatus||m.equipment||'Mat'; apparatusCounts[a]=(apparatusCounts[a]||0)+1; });
      const topApparatus = Object.keys(apparatusCounts).sort((a,b)=>apparatusCounts[b]-apparatusCounts[a])[0] || 'Mat';
      const level = c.experience==='advanced'?'Advanced':c.experience==='intermediate'?'Intermediate 1':'Beginner';
      const sessId = 'migrated_'+(old.id||newId());
      const rec = {
        id: sessId, clientId, date: old.date||Date.now(), format:'freeform', migratedLegacy:true,
        warmup:{enabled:false, exercises:[]}, goalTags:[],
        blocks:[{apparatus:topApparatus, level, exercises:(old.movements||[]).map(m=>({...m, apparatus:m.apparatus||m.equipment||topApparatus}))}],
        planWeekLinked:null, length: old.length||c.sessionLength,
      };
      out[sessId] = rec;
      c.recentSessions.unshift({ id:newId(), date:rec.date, summary:`Imported session — ${topApparatus}`, tags:[], sessionId:sessId });
    });
  });
  return out;
}

function loadData(){
  APPARATUS_LIST = safeParse('sg_apparatus', [...DEFAULT_APPARATUS]);
  CUSTOM_CONDITIONS = safeParse('sg_custom_conditions', []);
  classLibrary = safeParse('sg_class_library', []);

  const rawClients = safeParse('sg_clients', []);
  const version = localStorage.getItem('sg_schema_version');

  if(!rawClients.length){
    clients = seedDemoClients();
    sessions = {};
  } else if(version==='2'){
    clients = rawClients;
    sessions = safeParse('sg_sessions', {});
  } else {
    const legacyClasses = safeParse('sg_classes', {});
    clients = rawClients.map(migrateClient);
    sessions = migrateLegacySessions(legacyClasses, clients);
  }
  localStorage.setItem('sg_schema_version','2');
  persist();
}

let _refDB = null;
function openRefDB(){
  if(_refDB) return Promise.resolve(_refDB);
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open('sg_reference_db', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', {keyPath:'id'});
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files', {keyPath:'fileKey'});
    };
    req.onsuccess = ()=>{ _refDB = req.result; resolve(_refDB); };
    req.onerror = ()=>reject(req.error);
  });
}
function loadAllDocsFromIDB(){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('docs','readonly');
    const req = tx.objectStore('docs').getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  })).catch(e=>{ console.warn('[reference-library] IndexedDB unavailable', e); return null; });
}
function saveDocToIDB(doc){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('docs','readwrite');
    tx.objectStore('docs').put(doc);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function saveBlobToIDB(fileKey, file){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put({fileKey, blob:file, mimeType:file.type, uploadedAt:Date.now()});
    tx.oncomplete = ()=>resolve(fileKey);
    tx.onerror = ()=>reject(tx.error);
  }));
}
async function initReferenceLibrary(){
  const existing = await loadAllDocsFromIDB();
  if(existing===null){ REFERENCE_DOCS = REFERENCE_DOCS_SEED.map(d=>({...d})); return; }
  if(!existing.length){
    for(const d of REFERENCE_DOCS_SEED){ await saveDocToIDB(d); }
    REFERENCE_DOCS = REFERENCE_DOCS_SEED.map(d=>({...d}));
  } else {
    REFERENCE_DOCS = existing;
  }
}

let _pdfjsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(); };
    s.onerror = ()=>reject(new Error('Failed to load pdf.js'));
    document.head.appendChild(s);
  });
  return _pdfjsLoading;
}
async function extractPdfText(file){
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let text = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n\n';
  }
  return text.trim();
}

// legacy free-text injury matching, kept as a fallback signal alongside structured conditions
function legacyInjuryTokens(client){
  if(!client || !client.legacyInjuryNotes) return [];
  return client.legacyInjuryNotes.toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
}
function movHasWarning(mov, client){
  const injs = legacyInjuryTokens(client);
  if(!injs.length) return false;
  const cStr = (mov.contra||[]).join(' ').toLowerCase();
  return injs.some(inj=>cStr.includes(inj)||inj.split(' ').some(w=>w.length>3&&cStr.includes(w)));
}
function movHasStructuredWarning(mov, client){
  if(!client || !client.conditions || !client.conditions.length || !mov.avoidedByConditions || !mov.avoidedByConditions.length) return false;
  const names = client.conditions.map(c=>c.name);
  return mov.avoidedByConditions.some(a=>names.includes(a));
}
function movWarning(mov, client){ return movHasStructuredWarning(mov, client) || movHasWarning(mov, client); }

// ============================================================
// LEGACY GENERATION ENGINE (kept as an in-picker "assist", Decision A)
// ============================================================
function diffPool(difficulty){
  if(difficulty==='beginner') return ['beginner'];
  if(difficulty==='intermediate') return ['beginner','intermediate'];
  return ['beginner','intermediate','advanced'];
}
function generateClass(client, usedIds=[]){
  const total = SESSION_MOVEMENTS[client.sessionLength]||13;
  const key = [13,17,22].reduce((a,b)=>Math.abs(b-total)<Math.abs(a-total)?b:a);
  const dist = SECTION_DISTRIBUTION[key];
  const pool = diffPool(client.experience);
  const result = [];
  SECTION_ORDER.forEach(section=>{
    const count = dist[section]||0;
    let candidates = MOVEMENTS.filter(m=>m.section===section && pool.includes(m.difficulty) && !result.some(r=>r.id===m.id) && !usedIds.includes(m.id));
    if(!candidates.length) candidates = MOVEMENTS.filter(m=>m.section===section && pool.includes(m.difficulty) && !result.some(r=>r.id===m.id));
    if(!candidates.length) candidates = MOVEMENTS.filter(m=>m.section===section);
    result.push(...shuffle(candidates).slice(0,count));
  });
  return result;
}
function suggestExercisesForStage(apparatus, level, client, excludeIds, count){
  count = count||5;
  const pool = LEVEL_TO_DIFFICULTY_POOL[level]||['beginner'];
  let candidates = MOVEMENTS.filter(m=>m.apparatus===apparatus && pool.includes(m.difficulty) && !excludeIds.includes(m.id));
  candidates = shuffle(candidates);
  candidates.sort((a,b)=>(movWarning(a,client)?1:0)-(movWarning(b,client)?1:0));
  return candidates.slice(0,count);
}
function suggestSwapAlternatives(mov, currentExercises, client){
  const inClass = currentExercises.map(m=>m.id);
  let candidates = MOVEMENTS.filter(m=>m.id!==mov.id && !inClass.includes(m.id) && m.apparatus===mov.apparatus && m.bodyRegion===mov.bodyRegion);
  if(candidates.length<3){
    const more = MOVEMENTS.filter(m=>m.id!==mov.id && !inClass.includes(m.id) && m.apparatus===mov.apparatus && !candidates.some(c=>c.id===m.id));
    candidates=[...candidates,...more];
  }
  return shuffle(candidates).slice(0,3);
}
function catalogSearch(list, opts){
  const q=(opts.search||'').toLowerCase();
  return list.filter(m=>{
    if(opts.apparatus && m.apparatus!==opts.apparatus) return false;
    if(opts.levelPool && !opts.levelPool.includes(m.difficulty)) return false;
    if(q && !(m.name.toLowerCase().includes(q) || (m.desc||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderApp(){
  // Live-filtering search inputs re-render on every keystroke; since rendering rebuilds
  // innerHTML, the focused element is destroyed each time. Preserve focus + cursor
  // position across the rebuild by keying inputs with a stable data-focus-key.
  const active = document.activeElement;
  const focusKey = active && active.dataset ? active.dataset.focusKey : null;
  const selStart = focusKey && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = focusKey && 'selectionEnd' in active ? active.selectionEnd : null;

  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.toggle('active', l.dataset.view===VIEW));
  const main = document.getElementById('main');
  if(VIEW==='clients') main.innerHTML = CLIENT_VIEW==='profile' ? renderClientProfile() : renderClientList();
  else if(VIEW==='sessionBuilder') main.innerHTML = renderSessionBuilder();
  else if(VIEW==='classBuilder') main.innerHTML = renderClassBuilder();
  else if(VIEW==='referenceLibrary') main.innerHTML = renderReferenceLibrary();
  renderOverlays();

  if(focusKey){
    const el = document.querySelector('[data-focus-key="'+focusKey+'"]');
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

  document.getElementById('modal-root').innerHTML = MODAL ? renderModal() : '';

  c.symptoms.push({ id:newId(), date:new Date().toISOString().slice(0,10), location:HEALTH_STATE.location, description:HEALTH_STATE.description.trim() });
  persist();
  HEALTH_STATE = { symptomFormOpen:false, location:SYMPTOM_LOCATIONS[0], description:'' };
  showNotif('Observation logged');
  renderApp();
}
function openConditionPickerModal(clientId){
  MODAL = { type:'conditionPicker', clientId, search:'', customValue:'' };
  renderApp();
}
function addConditionToClient(clientId, name, custom){
  const c = getClient(clientId);
  if(c.conditions.some(cd=>cd.name===name)) { MODAL=null; renderApp(); return; }
  c.conditions.push({ id:newId(), name, custom:!!custom });
  if(custom && !CUSTOM_CONDITIONS.some(cc=>cc.name===name)){ CUSTOM_CONDITIONS.push({name}); }
  persist();
  MODAL = null;
  showNotif('Condition added');
  renderApp();
}
function removeConditionFromClient(clientId, condId){
  const c = getClient(clientId);
  c.conditions = c.conditions.filter(cd=>cd.id!==condId);

}
function openConditionPanel(name){ PANEL = {type:'condition', name}; renderApp(); }
function openSymptomPanel(symId){
  const c = getClient(SELECTED_CLIENT_ID);
  const sym = c.symptoms.find(s=>s.id===symId);

  PANEL = {type:'symptom', location:sym.location, description:sym.description, date:sym.date};

}

// CLIENTS — 3-MONTH PLAN TAB (Story 4)
// ============================================================
function getCurrentPlanWeek(c){
  if(!c.planStartDate) return 1;
  const weeksSince = Math.floor((Date.now()-new Date(c.planStartDate).getTime())/(7*864e5));
  return Math.min(Math.max(weeksSince+1,1),12);
}
function clientPlanWeek(c, n){
  const override = c.planWeeksOverride && c.planWeeksOverride[n];
  const tpl = PLAN_TEMPLATE[Math.min(Math.max(n,1),12)-1];
  return { apparatus: override?override.apparatus:tpl.apparatus, focus: override?override.focus:tpl.focus };
}
function clientStartPlan(clientId){
  const c = getClient(clientId);
  c.planStartDate = new Date().toISOString().slice(0,10);
  c.planWeeksOverride = {};
  persist();
  showNotif('3-month plan started');
  renderApp();
}
function clientExtendPlan(clientId){
  const c = getClient(clientId);
  const lastFocus = clientPlanWeek(c,12).focus;
  c.planHistory.push({ startDate:c.planStartDate, endDate:new Date().toISOString().slice(0,10), weeksOverride:c.planWeeksOverride });
  c.planStartDate = new Date().toISOString().slice(0,10);
  c.planWeeksOverride = { 1: {apparatus:PLAN_TEMPLATE[0].apparatus, focus:lastFocus} };
  persist();
  showNotif('Plan extended by 12 weeks');
  renderApp();
}
function startEditWeek(n){
  const c = getClient(SELECTED_CLIENT_ID);
  const wk = clientPlanWeek(c,n);
  PLAN_EDITING_WEEK = n;
  PLAN_EDIT_DRAFT = {apparatus:wk.apparatus, focus:wk.focus};
  renderApp();
}
function cancelEditWeek(){ PLAN_EDITING_WEEK=null; renderApp(); }
function saveEditWeek(n){
  const c = getClient(SELECTED_CLIENT_ID);
  c.planWeeksOverride[n] = {...PLAN_EDIT_DRAFT};
  persist();
  PLAN_EDITING_WEEK = null;
  showNotif('Week '+n+' updated');
  renderApp();
}
function sbStartFromPlan(clientId, weekNumber){
  const c = getClient(clientId);
  const wk = clientPlanWeek(c, weekNumber);
  sbReset(clientId, {apparatus:wk.apparatus, focus:wk.focus, weekNumber});
  VIEW = 'sessionBuilder';
  renderApp();
}
function clientRenderPlanTab(c){
  if(!c.planStartDate){
    return `<div class="empty-state"><div class="icon">🗓️</div><h3>No 3-month plan yet</h3><p>Start a rolling 12-week apparatus plan for ${esc(c.name)}</p><button class="btn btn-sage" onclick="clientStartPlan('${c.id}')">Start 3-Month Plan</button></div>`;
  }
  const current = getCurrentPlanWeek(c);
  const endingSoon = current>=10;
  let rows='';
  for(let n=1;n<=12;n++){
    const wk = clientPlanWeek(c,n);
    const status = n<current?'done':n===current?'current':'upcoming';
    if(PLAN_EDITING_WEEK===n){
      rows += `
        <div class="plan-week-edit">
          <div style="font-size:11.5px;color:var(--text-muted)">Editing Week ${n}</div>
          <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
              <label>Apparatus</label>
              <select onchange="PLAN_EDIT_DRAFT.apparatus=this.value">
                ${APPARATUS_LIST.map(a=>`<option value="${a}" ${PLAN_EDIT_DRAFT.apparatus===a?'selected':''}>${a}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label>Focus</label>
              <input type="text" value="${esc(PLAN_EDIT_DRAFT.focus)}" oninput="PLAN_EDIT_DRAFT.focus=this.value">
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-outline btn-sm" onclick="cancelEditWeek()">Cancel</button>
            <button class="btn btn-sage btn-sm" onclick="saveEditWeek(${n})">Save</button>
          </div>
        </div>`;
    } else {
      rows += `
        <div class="plan-week-row ${status}" onclick="startEditWeek(${n})">
          <div class="plan-week-num">W${n}</div>
          <div style="flex:1 1 200px;min-width:160px">
            <div style="font-size:13.5px;font-weight:600">${esc(wk.apparatus)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${esc(wk.focus)}</div>
          </div>
          <div style="flex-shrink:0;display:flex;align-items:center;gap:10px">
            ${status==='done'?`<span style="font-size:11px;color:var(--sage-dark);font-weight:600">Done</span>`:''}
            ${status==='current'?`<span style="font-size:11px;color:var(--sage-dark);font-weight:600">Current</span><button class="btn btn-outline btn-xs" onclick="event.stopPropagation();sbStartFromPlan('${c.id}',${n})">Build session from this week →</button>`:''}
          </div>
        </div>`;
    }
  }
  return `
    ${endingSoon?`
      <div class="plan-banner">
        <div style="font-size:13px"><strong>This plan wraps up in ${12-current} week${12-current===1?'':'s'}.</strong> <span style="color:var(--text-muted)">Extend it or start a new cycle when ready.</span></div>
        <button class="btn btn-sage btn-sm" onclick="clientExtendPlan('${c.id}')">Extend Plan</button>
      </div>`:''}
    <div>${rows}</div>
  `;
}

function sbGetEntity(targetType, idx){ return targetType==='abc' ? SB.abcStages[idx] : SB.freeformBlocks[idx]; }

function sbRenderExerciseRow(ex, targetType, idx, exIdx, client){
  const warn = movWarning(ex, client);
  const entity = sbGetEntity(targetType, idx);
  const swapping = entity.swapIdx===exIdx;
  let html = `
    <div class="exercise-row ${warn?'has-warning':''}">
      <div style="flex:1;min-width:120px">
        <div style="font-weight:500;font-size:13px">${esc(ex.name)}</div>

        <button class="icon-btn delete" title="Remove" onclick="sbRemoveExercise('${targetType}',${idx},${exIdx})">✕</button>
      </div>
    </div>
  `;
  if(swapping) html += sbRenderSwapPanel(entity, targetType, idx, exIdx, client, ex);

function sbToggleSwap(targetType, idx, exIdx){
  const entity = sbGetEntity(targetType, idx);
  entity.swapIdx = entity.swapIdx===exIdx ? null : exIdx;
  entity.swapMode = null;
  renderApp();
}
function sbSetSwapMode(targetType, idx, mode){ sbGetEntity(targetType,idx).swapMode=mode; renderApp(); }
function sbRenderSwapPanel(entity, targetType, idx, exIdx, client, ex){
  if(!entity.swapMode){
    return `
      <div class="inline-picker">
        <div style="font-size:12px;margin-bottom:8px">Swap "${esc(ex.name)}" for:</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="sbSetSwapMode('${targetType}',${idx},'suggest')">Suggested alternatives</button>
          <button class="btn btn-outline btn-sm" onclick="sbSetSwapMode('${targetType}',${idx},'library')">Browse catalog</button>
          <button class="btn btn-outline btn-sm" onclick="sbToggleSwap('${targetType}',${idx},${exIdx})">Cancel</button>
        </div>
      </div>`;
  }
  let candidates;
  if(entity.swapMode==='suggest') candidates = suggestSwapAlternatives(ex, entity.exercises, client);
  else candidates = catalogSearch(MOVEMENTS, {apparatus:entity.apparatus}).filter(m=>m.id!==ex.id && !entity.exercises.some(e2=>e2.id===m.id)).slice(0,30);
  return `
    <div class="inline-picker">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:12px">${entity.swapMode==='suggest'?'Suggested alternatives':'Browse catalog'}</div>
        <button class="icon-btn" onclick="sbToggleSwap('${targetType}',${idx},${exIdx})">✕</button>
      </div>
      ${candidates.length?candidates.map(m=>`<div class="pick-row" onclick="sbConfirmSwap('${targetType}',${idx},${exIdx},'${m.id}')">${esc(m.name)} <span style="color:var(--text-muted);font-size:11px">— ${esc(m.apparatus)}, ${m.difficulty}</span></div>`).join(''):`<div style="font-size:12px;color:var(--text-faint)">No alternatives found.</div>`}
    </div>
  `;
}
function sbConfirmSwap(targetType, idx, exIdx, movId){
  const mov = MOVEMENTS.find(m=>m.id===movId);
  const entity = sbGetEntity(targetType, idx);
  entity.exercises[exIdx] = {...mov};
  entity.swapIdx = null; entity.swapMode=null;
  showNotif('Exercise swapped');
  renderApp();
}
function sbRemoveExercise(targetType, idx, exIdx){ sbGetEntity(targetType, idx).exercises.splice(exIdx,1); renderApp(); }

function sbTogglePicker(targetType, idx){

}
function sbSetPickerSource(targetType, idx, source){ sbGetEntity(targetType,idx).pickerSource=source; renderApp(); }
function sbSetPickerSearch(targetType, idx, val){ sbGetEntity(targetType,idx).pickerSearch=val; renderApp(); }
function sbRenderPicker(entity, targetType, idx, client){

      </div>

            <div class="pick-row" onclick="sbAddExercise('${targetType}',${idx},'${m.id}')">${esc(m.name)} <span style="color:var(--text-muted);font-size:11px">— ${m.difficulty}${movWarning(m,client)?' · ⚠':''}</span></div>`).join('')) || `<div style="font-size:12px;color:var(--text-faint)">No matches for this apparatus/level.</div>`}

function sbQuickSuggest(targetType, idx){
  const entity = sbGetEntity(targetType, idx);

  const excludeIds = entity.exercises.map(e=>e.id);
  const picks = suggestExercisesForStage(entity.apparatus, entity.level, client, excludeIds, 4);

function sbAddExercise(targetType, idx, movId){

}

function sbRenderReferencePickerTab(entity, targetType, idx){
  const q = (entity.pickerSearch||'').toLowerCase();
  const matches = REFERENCE_DOCS.map(d=>{
    const secs = d.sections.map((s,si)=>({...s,si})).filter(s=> !q || s.heading.toLowerCase().includes(q) || s.content.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
    return {doc:d, secs};
  }).filter(x=>x.secs.length);
  return `
    <div class="library-filters">
      <input type="text" data-focus-key="sb-picker-${targetType}-${idx}" placeholder="Search reference library…" value="${esc(entity.pickerSearch)}" oninput="sbSetPickerSearch('${targetType}',${idx},this.value)">
    </div>
    <div style="max-height:260px;overflow-y:auto">
      ${matches.length?matches.map(({doc,secs})=>`
        <div style="margin-bottom:10px">
          <div style="font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:4px">${esc(doc.title)}</div>
          ${secs.map(s=>`
            <div class="pick-row" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div><div style="font-weight:600;font-size:12.5px">${esc(s.heading)}</div><div style="font-size:11.5px;color:var(--text-muted)">${esc(s.content.slice(0,90))}…</div></div>
              <button class="btn btn-outline btn-xs" onclick="sbAddFromReference('${targetType}',${idx},'${doc.id}',${s.si})">+ Add</button>
            </div>`).join('')}
        </div>
      `).join(''):`<div style="font-size:12px;color:var(--text-faint)">No reference matches. Try a different search term.</div>`}
    </div>
  `;
}
function findCatalogMatchFromText(text){
  const lower = text.toLowerCase();
  return MOVEMENTS.find(m=>lower.includes(m.name.toLowerCase()));
}
function sbAddFromReference(targetType, idx, docId, sectionIndex){
  const doc = REFERENCE_DOCS.find(d=>d.id===docId);
  const section = doc.sections[sectionIndex];
  const entity = sbGetEntity(targetType, idx);
  const match = findCatalogMatchFromText(section.heading+' '+section.content);
  const sourceRef = {docId, sectionIndex};
  if(match) entity.exercises.push({...match, sourceRef});
  else entity.exercises.push({ id:newId(), name:section.heading, apparatus:entity.apparatus, difficulty:'beginner', section:'warm-up', bodyRegion:'full body', contra:[], avoidedByConditions:[], isCustomFromReference:true, sourceRef });
  entity.pickerOpen = false;
  showNotif('Added from reference library');
  renderApp();
}
function refOpenFromChip(docId, sectionIndex){
  VIEW='referenceLibrary';

}

function sbOpenApparatusPicker(targetType, idx){ MODAL={type:'apparatusPicker', targetType, targetIndex:idx, search:''}; renderApp(); }

function addApparatus(){

function sbFinishSession(){ SB.screen='summary'; renderApp(); }
function sbEditSession(){ SB.screen = SB.lastFormat; renderApp(); }
function sbRenderSummary(){
  const goalKeys = Object.keys(SB.goalTags).filter(k=>SB.goalTags[k]);
  const units = SB.lastFormat==='abc' ? SB.abcStages.map((s,i)=>({label:'Stage '+['A','B','C'][i], ...s})) : SB.freeformBlocks.map((b,i)=>({label:'Block '+(i+1), ...b}));
  return `

      <div class="summary-block">
        <div class="eyebrow">Warm-Up</div>

      </div>`:''}
    ${goalKeys.length?`<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap">${goalKeys.map(k=>goalChip(k)).join('')}</div>`:''}
    ${units.map(u=>`

      </div>
    `).join('')}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">

      <button class="btn btn-sage" onclick="sbSaveSession()">Save Session</button>
    </div>
  `;

function sbBuildSummaryText(rec){
  const units = rec.format==='abc'?rec.stages:rec.blocks;
  const apps = [...new Set(units.map(u=>u.apparatus).filter(Boolean))];
  return (rec.format==='abc'?'ABC session':'Free-form session') + (apps.length?' — '+apps.join(', '):'');
}
function sbSaveSession(){
  const client = getClient(SB.clientId);
  const id = newId();
  const rec = {
    id, clientId: client.id, date: Date.now(), format: SB.lastFormat,
    warmup: {enabled:SB.warmupEnabled, exercises:[...SB.warmupExercises]},
    goalTags: Object.keys(SB.goalTags).filter(k=>SB.goalTags[k]),
    planWeekLinked: SB.prefill ? SB.prefill.weekNumber : null,
    length: client.sessionLength,
  };
  if(SB.lastFormat==='abc') rec.stages = SB.abcStages.map(s=>({apparatus:s.apparatus, level:s.level, exercises:s.exercises.map(e=>({...e}))}));
  else rec.blocks = SB.freeformBlocks.map(b=>({apparatus:b.apparatus, level:b.level, exercises:b.exercises.map(e=>({...e}))}));
  sessions[id] = rec;
  client.recentSessions.unshift({ id:newId(), date:rec.date, summary:sbBuildSummaryText(rec), tags:rec.goalTags, sessionId:id });
  persist();
  showNotif('Session saved');
  SB = null;
  openClientProfile(client.id);
}

function refFilteredDocs(){
  const q = (REF.search||'').toLowerCase();
  if(!q) return REFERENCE_DOCS;
  return REFERENCE_DOCS.filter(d=>
    d.title.toLowerCase().includes(q) || d.source.toLowerCase().includes(q) || d.excerpt.toLowerCase().includes(q) ||
    (d.fullText && d.fullText.toLowerCase().includes(q)) ||
    d.sections.some(s=>s.heading.toLowerCase().includes(q) || s.content.toLowerCase().includes(q))
  );
}
function refSetSearch(val){ REF.search = val; renderApp(); }
function refOpenDoc(id, sectionIndex){ REF.screen='viewer'; REF.activeDocId=id; REF.activeSectionIndex = sectionIndex!=null?sectionIndex:null; renderApp(); }
function refBackToList(){ REF.screen='list'; REF.activeSectionIndex=null; renderApp(); }
function refTriggerUpload(){ document.getElementById('ref-upload-input').click(); }
async function refHandleFileChosen(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  REF.uploading = true;
  renderApp();
  try{
    const text = await extractPdfText(file);
    const fileKey = newId();
    const doc = {
      id: newId(), title: file.name.replace(/\.pdf$/i,''), source:'Uploaded manual',
      date: new Date().toISOString().slice(0,10),
      excerpt: text.slice(0,220).trim() || 'No extractable text found in this PDF.',
      sections: [{heading:'Full Text', content: text || '(No extractable text found in this PDF.)'}],
      fullText: text, fileKey, linkedExerciseIds: [],
    };
    await saveDocToIDB(doc);
    await saveBlobToIDB(fileKey, file);
    REFERENCE_DOCS.push(doc);
    showNotif('Manual uploaded and indexed');
  } catch(e){
    console.error(e);
    showNotif('Could not process that PDF');
  }
  REF.uploading = false;
  renderApp();
}
function renderReferenceLibrary(){
  return REF.screen==='viewer' ? renderRefViewer() : renderRefList();
}
function renderRefList(){
  const docs = refFilteredDocs();
  return `
    <div class="page-header">
      <h2>Reference Library</h2>
      <button class="btn btn-sage" onclick="refTriggerUpload()" ${REF.uploading?'disabled':''}>${REF.uploading?'Processing…':'+ Upload Manual'}</button>
    </div>
    <p class="page-sub">Classical training manuals and studio notes — searchable by exercise name or keyword.</p>
    <div class="library-filters">
      <input type="text" data-focus-key="ref-search" placeholder="Search manuals…" value="${esc(REF.search)}" oninput="refSetSearch(this.value)">
    </div>
    ${docs.length?docs.map(d=>`
      <div class="doc-card" onclick="refOpenDoc('${d.id}')">
        <div style="font-size:15px;font-weight:600;font-family:'Cormorant Garamond',serif;margin-bottom:2px">${esc(d.title)}</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px">${esc(d.source)} · ${formatDate(d.date)}</div>
        <div style="font-size:12.5px;color:var(--text)">${esc(d.excerpt)}</div>
      </div>
    `).join(''):`<div class="empty-state"><div class="icon">📚</div><h3>No matches</h3><p>No documents match "${esc(REF.search)}"</p></div>`}
  `;
}
function renderRefViewer(){
  const d = REFERENCE_DOCS.find(x=>x.id===REF.activeDocId);
  if(!d) return renderRefList();
  return `
    <div class="breadcrumb"><span onclick="refBackToList()">Reference Library</span> › ${esc(d.title)}</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:4px">${esc(d.source)} · ${formatDate(d.date)}</div>
    <h2 style="margin-bottom:20px">${esc(d.title)}</h2>
    ${d.sections.map((s,i)=>`
      <div class="doc-section ${REF.activeSectionIndex===i?'highlighted':''}">
        <h3 style="font-size:17px;margin-bottom:6px">${esc(s.heading)}</h3>
        <p style="font-size:13.5px;line-height:1.7;color:var(--text)">${esc(s.content)}</p>
      </div>
    `).join('')}
  `;
}

function renderModal(){
  const overlay = (inner, cls) => `<div class="modal-overlay" onclick="closeModal()"><div class="modal-box ${cls||''}" onclick="stopProp(event)">${inner}</div></div>`;
  if(MODAL.type==='clientForm') return overlay(renderClientFormModal());

}
function renderClientFormModal(){
  const d = MODAL.data;
  return `
    <div class="modal-title">${MODAL.editingId?'Edit client':'New client'}</div>
    <div class="form-group">
      <label>Name *</label>
      <input type="text" value="${esc(d.name)}" placeholder="Client name" oninput="updateModalField('name',this.value)">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Age</label>
        <input type="number" value="${esc(d.age)}" oninput="updateModalField('age',this.value)">
      </div>
      <div class="form-group">
        <label>Experience</label>
        <select onchange="updateModalField('experience',this.value)">
          <option value="beginner" ${d.experience==='beginner'?'selected':''}>Beginner</option>
          <option value="intermediate" ${d.experience==='intermediate'?'selected':''}>Intermediate</option>
          <option value="advanced" ${d.experience==='advanced'?'selected':''}>Advanced</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Session length</label>
        <select onchange="updateModalField('sessionLength',this.value,Number)">
          <option value="40" ${d.sessionLength==40?'selected':''}>40 minutes</option>
          <option value="50" ${d.sessionLength==50?'selected':''}>50 minutes</option>
          <option value="60" ${d.sessionLength==60?'selected':''}>60 minutes</option>
        </select>
      </div>
      <div class="form-group">
        <label>Classes / week</label>
        <select onchange="updateModalField('classesPerWeek',this.value,Number)">
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${d.classesPerWeek==n?'selected':''}>${n}x per week</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Goals</label>
      <input type="text" value="${esc(d.goals)}" placeholder="e.g. core strength, mobility" oninput="updateModalField('goals',this.value)">
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sage" onclick="saveClientFromModal()">Save Client</button>
    </div>
  `;
}
function renderConditionPickerModal(){
  const search = (MODAL.search||'').toLowerCase();
  const client = getClient(MODAL.clientId);
  const existingNames = client.conditions.map(c=>c.name);
  const seen = new Set();
  const results = allConditionNames().filter(n=>{
    if(seen.has(n)) return false; seen.add(n);
    return !existingNames.includes(n) && n.toLowerCase().includes(search);
  });
  return `
    <div class="modal-title">Add condition</div>
    <input type="text" data-focus-key="condition-picker-search" placeholder="Search conditions…" value="${esc(MODAL.search)}" oninput="MODAL.search=this.value; renderApp()" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;margin-bottom:14px">
    <div style="max-height:240px;overflow-y:auto;margin-bottom:14px">
      ${results.length?results.map(n=>`<div class="pick-row" onclick="addConditionToClient('${MODAL.clientId}','${n.replace(/'/g,"\\'")}',false)">${esc(n)}</div>`).join(''):`<div style="text-align:center;padding:14px;font-size:12px;color:var(--text-faint)">No matches — add it as a custom condition below.</div>`}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input type="text" placeholder="Add a custom condition…" value="${esc(MODAL.customValue)}" oninput="MODAL.customValue=this.value" style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit">
      <button class="btn btn-outline" onclick="confirmAddCustomCondition()">Add</button>
    </div>
    <div style="text-align:right"><span style="font-size:12px;color:var(--text-faint);cursor:pointer" onclick="closeModal()">Close</span></div>
  `;
}
function confirmAddCustomCondition(){
  const val = (MODAL.customValue||'').trim();
  if(!val) return;
  addConditionToClient(MODAL.clientId, val, true);
}
function renderHandoffModal(){
  const c = getClient(MODAL.clientId);
  const wk = getCurrentPlanWeek(c);
  const planInfo = c.planStartDate ? clientPlanWeek(c,wk) : null;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:10.5px;letter-spacing:0.8px;text-transform:uppercase;color:var(--sage-dark);font-weight:700">Substitute Handoff</div>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <h2 style="margin-bottom:18px">${esc(c.name)}</h2>
    <div style="background:var(--warning-bg);border:1px solid #f0c8b8;border-radius:10px;padding:14px 16px;margin-bottom:18px">
      <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--warning);margin-bottom:5px">Contraindications</div>
      <div style="font-size:13px">${esc(conditionsSummary(c))}</div>
    </div>
    <div style="margin-bottom:16px"><div class="field-label">Goals</div><div style="font-size:13px">${esc(c.goals)||'—'}</div></div>
    <div style="margin-bottom:16px">
      <div class="field-label">Recent sessions</div>
      ${(c.recentSessions||[]).slice(0,3).map(s=>`<div style="font-size:12.5px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px">${esc(s.summary)} <span style="color:var(--text-faint);font-size:11px">— ${formatDate(s.date)}</span></div>`).join('') || `<div style="font-size:12px;color:var(--text-faint)">No sessions logged yet.</div>`}
    </div>
    <div style="margin-bottom:22px"><div class="field-label">Current plan focus</div><div style="font-size:13px">${planInfo?esc(planInfo.apparatus)+' — '+esc(planInfo.focus):'No active plan'}</div></div>
    <button class="btn btn-sage" style="width:100%" onclick="copyHandoffLink()">Copy shareable link</button>
  `;
}
function renderApparatusPickerModal(){
  const search = (MODAL.search||'').toLowerCase();
  const results = APPARATUS_LIST.filter(a=>a.toLowerCase().includes(search));
  return `
    <div class="modal-title">Choose apparatus</div>
    <input type="text" data-focus-key="apparatus-picker-search" placeholder="Search apparatus…" value="${esc(MODAL.search)}" oninput="MODAL.search=this.value; renderApp()" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;margin-bottom:14px">
    <div style="max-height:280px;overflow-y:auto;margin-bottom:12px">
      ${results.map(a=>`<div class="pick-row" onclick="sbSelectApparatus('${a.replace(/'/g,"\\'")}')">${esc(a)}</div>`).join('') || `<div style="font-size:12px;color:var(--text-faint)">No matches.</div>`}
    </div>
    <div style="text-align:right"><span style="font-size:12px;color:var(--sage-dark);cursor:pointer" onclick="openManageApparatusModal()">+ Manage apparatus</span></div>
  `;
}
function renderManageApparatusModal(){
  return `
    <div class="modal-title">Manage apparatus</div>
    <div style="max-height:220px;overflow-y:auto;margin-bottom:14px">
      ${APPARATUS_LIST.map(a=>`<div style="padding:9px 12px;font-size:13px;border-bottom:1px solid var(--bg2)">${esc(a)}</div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input type="text" placeholder="Add new apparatus…" value="${esc(MODAL.newName)}" oninput="MODAL.newName=this.value" style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit">
      <button class="btn btn-sage" onclick="addApparatus()">Add</button>
    </div>
    <div class="form-actions" style="margin-top:0"><button class="btn btn-outline" onclick="closeModal()">Done</button></div>
  `;
}
function renderSaveClassModal(){
  return `
    <div class="modal-title">Save to Library</div>
    <div class="form-group">
      <label>Class name</label>
      <input type="text" value="${esc(MODAL.name)}" placeholder="e.g. Tuesday 6pm Barre" oninput="MODAL.name=this.value">
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sage" onclick="cbConfirmSaveClass()">Save</button>
    </div>
  `;
}

// ============================================================
// SLIDE-OVER REFERENCE PANEL (Story 3 / 10 educational info)
// ============================================================
function renderPanelRoot(){
  let title='', blurb='', favored=[], avoided=[];
  if(PANEL.type==='condition'){
    const info = findConditionInfo(PANEL.name);
    if(info){ title=info.name; blurb=info.blurb; favored=info.favored; avoided=info.avoided; }
    else { title=PANEL.name; blurb='Custom condition — no standard reference on file. Use clinical judgment and client-reported information.'; }
  } else {
    const loc = (PANEL.name||PANEL.location||'').toLowerCase();
    const match = CONDITIONS_LIBRARY.find(c=>c.name.toLowerCase().includes(loc));
    title = PANEL.location + ' — ' + formatDate(PANEL.date);
    blurb = 'Observed: "'+PANEL.description+'". ' + (match?match.blurb:'General reference: monitor how this presents during loaded vs. unloaded movement, and note any consistent pattern across sessions.');
    favored = match?match.favored:['Mobility work in pain-free range'];
    avoided = match?match.avoided:['Loading into the aggravating range'];
  }
  return `
    <div class="slideover-overlay" onclick="closePanel()">
      <div class="slideover-panel" onclick="stopProp(event)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:8px">
            <span>✨</span>
            <span style="font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#8a9a86">Reference info</span>
          </div>
          <button class="icon-btn" onclick="closePanel()">✕</button>
        </div>
        <h2 style="font-size:22px;margin-bottom:14px">${esc(title)}</h2>
        <p style="font-size:13.5px;color:var(--text);line-height:1.65;margin-bottom:20px">${esc(blurb)}</p>
        <div style="margin-bottom:16px">
          <div class="eyebrow">Commonly favored</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${favored.map(a=>`<span class="chip" style="background:#e8f4ea;color:#3d7a47">${esc(a)}</span>`).join('')}</div>
        </div>
        <div style="margin-bottom:22px">
          <div class="eyebrow">Often avoided</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${avoided.map(a=>`<span class="chip" style="background:#fdf0eb;color:#d97054">${esc(a)}</span>`).join('')}</div>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px">
          <p style="font-size:11.5px;color:var(--text-muted);line-height:1.6">This is general educational reference, not a diagnosis. Always recommend a client consult a qualified medical professional for evaluation of any condition or symptom.</p>
        </div>
      </div>
    </div>
  `;
}

  if(e.key==='Enter') doLogin();
});
if(isAuthed()) initApp(); else { document.getElementById('login-screen').style.display='flex'; loadData(); initReferenceLibrary(); }
